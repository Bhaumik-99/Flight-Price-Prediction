<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Price Prediction</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --background-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            background: var(--background-gradient);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: rgba(44, 62, 80, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: var(--card-shadow);
            border-bottom: 3px solid var(--secondary-color);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: white !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 2rem;
            margin-top: 2rem;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: none;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: linear-gradient(45deg, var(--secondary-color), #5dade2);
            color: white;
            border: none;
            padding: 1rem;
            font-weight: 600;
        }

        .card-header i {
            margin-right: 8px;
        }

        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0.75rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
            transform: scale(1.02);
        }

        .submit-btn {
            background: linear-gradient(45deg, var(--accent-color), #c0392b);
            border: none;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.4);
        }

        .prediction-result {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin: 2rem 0;
            box-shadow: var(--card-shadow);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 2.5rem;
        }

        .floating-label {
            position: relative;
        }

        .floating-label label {
            position: absolute;
            left: 1rem;
            top: -0.5rem;
            background: white;
            padding: 0 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--secondary-color);
            z-index: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 1rem;
                padding: 1rem;
            }
            
            .section-title {
                font-size: 2rem;
            }
        }

        .loading-spinner {
            display: none;
            margin-left: 10px;
        }

        .form-row {
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-plane"></i>
                FLIGHT PRICE PREDICTOR
            </a>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <div class="main-container">
            <h1 class="section-title">
                <i class="fas fa-calculator"></i>
                Predict Your Flight Price
            </h1>

            <form action="/predict" method="post" id="predictionForm">
                <div class="row form-row">
                    <div class="col-lg-6 mb-4">
                        <div class="card form-card">
                            <div class="card-header">
                                <i class="fas fa-plane-departure"></i>
                                Departure Details
                            </div>
                            <div class="card-body">
                                <div class="floating-label">
                                    <label for="Dep_Time">Departure Date & Time</label>
                                    <input type="datetime-local" 
                                           name="Dep_Time" 
                                           id="Dep_Time" 
                                           class="form-control" 
                                           required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 mb-4">
                        <div class="card form-card">
                            <div class="card-header">
                                <i class="fas fa-plane-arrival"></i>
                                Arrival Details
                            </div>
                            <div class="card-body">
                                <div class="floating-label">
                                    <label for="Arrival_Time">Arrival Date & Time</label>
                                    <input type="datetime-local" 
                                           name="Arrival_Time" 
                                           id="Arrival_Time" 
                                           class="form-control" 
                                           required>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row form-row">
                    <div class="col-lg-6 mb-4">
                        <div class="card form-card">
                            <div class="card-header">
                                <i class="fas fa-map-marker-alt"></i>
                                Source City
                            </div>
                            <div class="card-body">
                                <div class="floating-label">
                                    <label for="Source">From</label>
                                    <select name="Source" id="Source" class="form-select" required>
                                        <option value="">Select Source City</option>
                                        <option value="Delhi">Delhi</option>
                                        <option value="Kolkata">Kolkata</option>
                                        <option value="Mumbai">Mumbai</option>
                                        <option value="Chennai">Chennai</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 mb-4">
                        <div class="card form-card">
                            <div class="card-header">
                                <i class="fas fa-flag-checkered"></i>
                                Destination City
                            </div>
                            <div class="card-body">
                                <div class="floating-label">
                                    <label for="Destination">To</label>
                                    <select name="Destination" id="Destination" class="form-select" required>
                                        <option value="">Select Destination</option>
                                        <option value="Cochin">Cochin</option>
                                        <option value="Delhi">Delhi</option>
                                        <option value="New Delhi">New Delhi</option>
                                        <option value="Hyderabad">Hyderabad</option>
                                        <option value="Kolkata">Kolkata</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row form-row">
                    <div class="col-lg-6 mb-4">
                        <div class="card form-card">
                            <div class="card-header">
                                <i class="fas fa-route"></i>
                                Number of Stops
                            </div>
                            <div class="card-body">
                                <div class="floating-label">
                                    <label for="stops">Stops</label>
                                    <select name="stops" id="stops" class="form-select" required>
                                        <option value="">Select Stops</option>
                                        <option value="0">Non-Stop</option>
                                        <option value="1">1 Stop</option>
                                        <option value="2">2 Stops</option>
                                        <option value="3">3 Stops</option>
                                        <option value="4">4 Stops</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 mb-4">
                        <div class="card form-card">
                            <div class="card-header">
                                <i class="fas fa-plane"></i>
                                Preferred Airline
                            </div>
                            <div class="card-body">
                                <div class="floating-label">
                                    <label for="airline">Airline</label>
                                    <select name="airline" id="airline" class="form-select" required>
                                        <option value="">Select Airline</option>
                                        <option value="Jet Airways">Jet Airways</option>
                                        <option value="IndiGo">IndiGo</option>
                                        <option value="Air India">Air India</option>
                                        <option value="Multiple carriers">Multiple carriers</option>
                                        <option value="SpiceJet">SpiceJet</option>
                                        <option value="Vistara">Vistara</option>
                                        <option value="Air Asia">Air Asia</option>
                                        <option value="GoAir">GoAir</option>
                                        <option value="Multiple carriers Premium economy">Multiple carriers Premium economy</option>
                                        <option value="Jet Airways Business">Jet Airways Business</option>
                                        <option value="Vistara Premium economy">Vistara Premium economy</option>
                                        <option value="Trujet">Trujet</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-danger submit-btn">
                        <i class="fas fa-search"></i>
                        Predict Flight Price
                        <div class="spinner-border spinner-border-sm loading-spinner" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </div>
            </form>

            <div id="predictionResult" class="prediction-result" style="display: none;">
                <i class="fas fa-rupee-sign"></i>
                <span id="predictionText">{{ prediction_text }}</span>
            </div>

            <div class="footer">
                <p>
                    <i class="fas fa-copyright"></i>
                    2024 Flight Price Predictor - Powered by Machine Learning
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form validation and enhancement
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('.submit-btn');
            const spinner = submitBtn.querySelector('.loading-spinner');
            
            // Show loading state
            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            
            // Validate departure time is before arrival time
            const depTime = new Date(document.getElementById('Dep_Time').value);
            const arrTime = new Date(document.getElementById('Arrival_Time').value);
            
            if (depTime >= arrTime) {
                e.preventDefault();
                alert('Departure time must be before arrival time!');
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                return;
            }
            
            // Validate source and destination are different
            const source = document.getElementById('Source').value;
            const destination = document.getElementById('Destination').value;
            
            if (source === destination && source !== '') {
                e.preventDefault();
                alert('Source and destination cannot be the same!');
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                return;
            }
        });

        // Set minimum date to today
        const today = new Date();
        const minDate = today.toISOString().slice(0, 16);
        document.getElementById('Dep_Time').min = minDate;
        document.getElementById('Arrival_Time').min = minDate;

        // Update arrival minimum when departure is selected
        document.getElementById('Dep_Time').addEventListener('change', function() {
            const depTime = this.value;
            document.getElementById('Arrival_Time').min = depTime;
        });

        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Show prediction result with animation (if prediction_text exists)
        if (typeof prediction_text !== 'undefined' && prediction_text) {
            const resultDiv = document.getElementById('predictionResult');
            document.getElementById('predictionText').textContent = prediction_text;
            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>

</html>
